# This file configures the Dart analyzer to check for errors, warnings, and lints.
# Run `flutter analyze` to analyze the project.

analyzer:
  # Exclude generated build and platform-specific files from analysis.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# Includes the recommended lint rules for Flutter projects.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Enforces single quotes for string literals.
    prefer_single_quotes: true
