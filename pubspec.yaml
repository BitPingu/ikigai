name: ikigai
description: "A self-help productivity app with a focus on motivation through gamification."

# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

# Defines the version and build number for the application.
# The version consists of three numbers separated by dots, followed by an optional build number.
# Both can be overridden when building with --build-name and --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your application needs to work.
# To check for newer versions, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Provides the Cupertino Icons font for iOS-style icons.
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  fl_chart: ^1.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Provides recommended lint rules for Flutter projects.
  flutter_lints: ^6.0.0

  # Generates launcher icons for Android and iOS.
  flutter_launcher_icons: ^0.14.4

# Flutter-specific configuration.
flutter:
  # Includes the Material Icons font in the application.
  uses-material-design: true

  # Includes application image assets.
  assets:
    - images/

# Configuration for flutter_launcher_icons.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/icon.png"
  min_sdk_android: 21
